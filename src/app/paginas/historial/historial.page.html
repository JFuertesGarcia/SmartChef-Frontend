<ion-content [fullscreen]="true">
  <h1>Historial</h1>

  <div class="contenedor">
    <p class="fecha">Hoy</p>
    <hr class="linea">
    <app-tarjetahistorial/>
    <app-tarjetahistorial/>
    <app-tarjetahistorial/>
    <p class="fecha">Ayer</p>
    <hr class="linea">
    <app-tarjetahistorial/>
    <app-tarjetahistorial/>
    <p class="bajo"></p>
  </div>
  <ion-fab slot="fixed" horizontal="center" class="botoncalculo">
    <ion-button id="open-modal" class="boton" expand="block">CALCULAR SEMANA</ion-button>
  </ion-fab>
  <ion-modal #modal trigger="open-modal">
    <ng-template>
      <ion-content class="ion-padding">
        <h1>Tu Semana</h1>
        <p class="fecha">Lunes</p>
        <hr class="linea">
        <app-tarjetahistorial/>
        <app-tarjetahistorial/>
        <p class="fecha">Martes</p>
        <hr class="linea">
        <app-tarjetahistorial/>
        <app-tarjetahistorial/>
        <app-tarjetahistorial/>
        <div class="sumaTotal">
          <p class="total">TOTAL: </p>
          <p class="boton">3000 CAL</p>
          <ion-button class="botonVolver" (click)="modal.dismiss()">
            <ion-icon name="return-down-back-outline"></ion-icon>
          </ion-button>
        </div>

      </ion-content>
    </ng-template>
  </ion-modal>
</ion-content>
